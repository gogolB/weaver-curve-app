[package]
name = "weaver-curve-app"
version = "1.4.0"
description = "A software app designed to help medical providers run a Weaver Curve with Gestational Age Correction"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interp = "1.0.3"
thiserror = "2"

