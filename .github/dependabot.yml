# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# All ecosystems run weekly on Monday so related PRs (e.g. Tauri npm packages
# and their matching Rust crates) arrive together. Updates are grouped so you
# get at most a handful of PRs per week instead of one per dependency.

version: 2
updates:
  # Frontend (npm) — SvelteKit, Vite, Tailwind, test tooling
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Tauri npm packages must stay in sync with the Rust crates in
      # src-tauri/Cargo.toml — review alongside the matching cargo "tauri" PR.
      tauri:
        patterns:
          - "@tauri-apps/*"
      # Everything else (runtime + dev dependencies) in one PR.
      # Majors are excluded so breaking upgrades (e.g. Tailwind 3→4)
      # arrive as individual PRs that can be migrated deliberately.
      frontend:
        patterns:
          - "*"
        exclude-patterns:
          - "@tauri-apps/*"
        update-types:
          - "minor"
          - "patch"

  # Backend (cargo) — Tauri core, plugins, serde, etc.
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Counterpart to the npm "tauri" group above.
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
      # Majors arrive individually (see frontend group note) — the interp
      # 1→2 breaking bump is the kind of change to review on its own.
      rust:
        patterns:
          - "*"
        exclude-patterns:
          - "tauri"
          - "tauri-*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
